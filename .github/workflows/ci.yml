name: Hyprland Dots Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Validate Dotfiles & Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linting Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq python3-flake8

      - name: ShellScript Linting (shellcheck)
        run: |
          echo "==> Checking Bash / Shell scripts..."
          find . -type f \( -name "*.sh" -o -name "*.bash" \) -exec shellcheck --severity=warning {} +

      - name: JSON Syntax Check
        run: |
          echo "==> Validating JSON configuration files..."
          find . -type f -name "*.json" -exec jq empty {} +

      - name: Python Script Check
        run: |
          echo "==> Linting Python scripts..."
          if find . -name "*.py" | grep -q .; then
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          fi
